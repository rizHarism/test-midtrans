<!DOCTYPE html>
<html>

<head>
    <title>Midtrans Test API</title>
    <!-- Load Snap.js dengan client key dari environment -->
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js"
        data-client-key="<%= process.env.MIDTRANS_CLIENT_KEY %>">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="m-10">
    <h1 class="text-2xl font-bold mb-4 ms-3">Midtrans API - Karya Data</h1>

    <div class="max-w-xs rounded-2xl overflow-hidden shadow-lg bg-white">
        <div class="flex justify-center m-5">
            <img class="w-40"
                src="https://www.az-delivery.de/cdn/shop/products/esp32-nodemcu-module-wlan-wifi-development-board-mit-cp2102-nachfolgermodell-zum-esp8266-kompatibel-mit-arduino-872375.jpg?v=1679400491"
                alt="Product Image" />
        </div>
        <div class="bg-sky-100">
            <div class="text-center">
                <h1 class="text-2xl pt-6 font-semibold mb-2">ESP 32</h1>
                <span class="text-sm">Hardware IoT</span>
            </div>
            <div class="py-4 flex justify-center">
                <button class="bg-blue-600 text-white py-2 px-4 rounded-full hover:bg-blue-700 transition"
                    onclick="createPayment(75000)">
                    Beli Sekarang Rp 75.000,-
                </button>
            </div>
        </div>
    </div>

    <div id="result" class="max-w-xs mt-4 rounded-2xl text-center"></div>
    <div id="esp-notif" class="max-w-xs mt-4 rounded-2xl text-center"></div>

    <script>
        async function createPayment(amount) {
            document.getElementById('esp-notif').innerHTML =
                '';
            const result = document.getElementById('result');
            result.innerHTML = '<div class="bg-blue-100 p-3 rounded">Membuat transaksi...</div>';

            try {
                const orderId = 'ORDER-' + Date.now();

                // Panggil API sendiri sendiri > mengarah ke file api/transaction.js
                const response = await fetch('/api/transaction', {
                    method: 'POST',
                    headers: {
                        accept: 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: amount,
                        order_id: orderId
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                // Tampilkan Snap Popup
                window.snap.pay(data.token, {
                    onSuccess: function (result) {
                        document.getElementById('result').innerHTML =
                            '<div class="bg-green-100 p-3 rounded"> Pembayaran Success<br>Order ID: ' + result.order_id + '</div>';
                        sendToMQTT("success")
                    },
                    onPending: function (result) {
                        document.getElementById('result').innerHTML =
                            '<div class="bg-orange-100 p-3 rounded"> Pembayaran Pending!<br>Order ID: ' + result.order_id + '</div>';
                    },
                });

            } catch (error) {
                result.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
                console.error('Payment Error:', error);
            }
        }

        async function sendToMQTT(statusPayment) {
            try {
                const response = await fetch('/api/notification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        payment: statusPayment,
                    })
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('esp-notif').innerHTML =
                        `<div class="bg-blue-100 p-3 rounded">${result.message}</div>`;
                    console.log('MQTT triggered');
                } else {
                    document.getElementById('esp-notif').innerHTML =
                        `<div class="bg-red-100 p-3 rounded">${result.message}</div>`;
                    console.log('MQTT triggered');
                }
            } catch (error) {
                console.error('Error triggering MQTT:', error);
                alert('Payment success but ESP32 notification failed');
            }
        }

    </script>
</body>

</html>
