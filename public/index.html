<!DOCTYPE html>
<html>

<head>
    <title>Midtrans Test API</title>
    <!-- Load Snap.js dengan client key dari environment -->
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js"
        data-client-key="<%= process.env.MIDTRANS_CLIENT_KEY %>">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        .result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <h1 class="text-2xl font-bold mb-4">Midtrans API - Karya Data</h1>

    <div class="max-w-xs rounded-2xl overflow-hidden shadow-lg bg-white">
        <div class="flex justify-center m-5">
            <img class="w-40"
                src="https://www.az-delivery.de/cdn/shop/products/esp32-nodemcu-module-wlan-wifi-development-board-mit-cp2102-nachfolgermodell-zum-esp8266-kompatibel-mit-arduino-872375.jpg?v=1679400491"
                alt="Product Image" />
        </div>
        <div class="bg-sky-100">
            <div class="text-center">
                <h1 class="text-2xl pt-6 font-semibold mb-2">ESP 32</h1>
                <span class="text-sm">Hardware IoT</span>
            </div>
            <div class="py-4 flex justify-center">
                <button class="bg-blue-600 text-white py-2 px-4 rounded-full hover:bg-blue-700 transition"
                    onclick="createPayment(75000)">
                    Beli Sekarang Rp 75.000,-
                </button>
            </div>
        </div>
    </div>

    <div id="result" class="max-w-xs mt-4 rounded-2xl text-center"></div>

    <script>
        async function createPayment(amount) {
            const result = document.getElementById('result');
            result.innerHTML = '<div class="bg-blue-100 p-3 rounded">Membuat transaksi...</div>';

            try {
                const orderId = 'TEST_' + Date.now();

                // Panggil API kita sendiri
                const response = await fetch('/api/transaction', {
                    method: 'POST',
                    headers: {
                        accept: 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: amount,
                        order_id: orderId
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                // Tampilkan Snap Popup
                window.snap.pay(data.token, {
                    onSuccess: function (result) {
                        document.getElementById('result').innerHTML =
                            '<div class="success">✅ PAYMENT SUCCESS!<br>Order ID: ' + result.order_id + '</div>';
                    },
                    onPending: function (result) {
                        document.getElementById('result').innerHTML =
                            '<div class="success">⏳ PAYMENT PENDING<br>Order ID: ' + result.order_id + '</div>';
                    },
                    onError: function (result) {
                        document.getElementById('result').innerHTML =
                            '<div class="error">❌ PAYMENT FAILED<br>Order ID: ' + result.order_id + '</div>';
                    }
                });

            } catch (error) {
                result.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
                console.error('Payment Error:', error);
            }
        }
    </script>
</body>

</html>
