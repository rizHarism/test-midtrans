<!DOCTYPE html>
<html>

<head>
    <title>Snap Test - WORKING VERSION</title>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js"
        data-client-key="Mid-client-oAs8x_AcQLaRYsXD"></script>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .credit-card {
            background: #4CAF50;
            color: white;
        }

        .gopay {
            background: #00AA13;
            color: white;
        }

        .shopeepay {
            background: #EE2A24;
            color: white;
        }

        .va {
            background: #2196F3;
            color: white;
        }

        .result {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎯 Snap Payment Test</h1>
        <p>Pilih payment method untuk test:</p>

        <button class="credit-card" onclick="createPayment('credit_card')">💳 Credit Card</button>
        <button class="gopay" onclick="createPayment('gopay')">📱 Gopay</button>
        <button class="shopeepay" onclick="createPayment('shopeepay')">🛍️ Shopeepay</button>
        <button class="va" onclick="createPayment('bca_va')">🏦 BCA VA</button>

        <div id="loading" style="display: none; text-align: center;">
            <div
                style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto;">
            </div>
            <p>Creating transaction...</p>
        </div>

        <div id="result" class="result"></div>

        <div style="background: #e7f3ff; padding: 15px; border-radius: 5px; margin-top: 20px;">
            <h3>💡 Testing Instructions:</h3>
            <p><strong>Credit Card:</strong> Use <code>4811 1111 1111 1114</code> (Exp: 12/34, CVV: 123)</p>
            <p><strong>Gopay/Shopeepay:</strong> Auto success in 1-2 minutes</p>
            <p><strong>BCA VA:</strong> Use VA number <code>3901234567890</code> for auto success</p>
        </div>
    </div>

    <script>
        const SERVER_KEY = 'Mid-server-vPNbaSeO5J4kmzQ5iEu91J3M';

        async function createPayment(paymentMethod) {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            loading.style.display = 'block';
            result.innerHTML = '';

            try {
                // Try direct call first (if using local server)
                let response;

                const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
                const targetUrl = 'https://app.sandbox.midtrans.com/snap/v1/transactions';

                response = await fetch(proxyUrl + targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa(SERVER_KEY + ':')
                    },
                    body: JSON.stringify({
                        transaction_details: {
                            order_id: paymentMethod.toUpperCase() + '_' + Date.now(),
                            gross_amount: 10000
                        },
                        enabled_payments: [paymentMethod]
                    })
                });


                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                loading.style.display = 'none';

                console.log(data)
                console.log(data.token)

                if (!data.token) {
                    throw new Error('No token received from Midtrans');
                }

                // Open Snap popup
                window.snap.pay(data.token, {
                    onSuccess: function (result) {
                        console.log(result);
                        showResult('✅ <strong>PAYMENT SUCCESS!</strong><br>' +
                            'Order ID: ' + result.order_id + '<br>' +
                            'Payment Type: ' + result.payment_type + '<br>' +
                            'Amount: ' + result.gross_amount, 'success');
                    },
                    onPending: function (result) {
                        showResult('⏳ <strong>PAYMENT PENDING</strong><br>' +
                            'Order ID: ' + result.order_id + '<br>' +
                            'Payment Type: ' + result.payment_type + '<br><br>' +
                            getPendingInstructions(result.payment_type), 'warning');
                    },
                    onError: function (result) {
                        showResult('❌ <strong>PAYMENT FAILED</strong><br>' +
                            'Order ID: ' + result.order_id + '<br>' +
                            'Status: ' + result.status_code, 'error');
                    },
                    onClose: function () {
                        showResult('🔒 <strong>PAYMENT POPUP CLOSED</strong><br>' +
                            'Transaction is still pending.<br>' +
                            'You can check status in Sandbox Dashboard.', 'info');
                    }
                });

            } catch (error) {
                loading.style.display = 'none';
                showResult('❌ <strong>ERROR CREATING TRANSACTION</strong><br>' + error.message, 'error');
                console.error('Error:', error);
            }
        }

        function showResult(message, type) {
            const result = document.getElementById('result');
            const colors = {
                success: '#d4edda',
                warning: '#fff3cd',
                error: '#f8d7da',
                info: '#d1ecf1'
            };
            result.innerHTML = `<div style="background:${colors[type]}; padding:20px; border-radius:5px;">${message}</div>`;
        }

        function getPendingInstructions(paymentType) {
            const instructions = {
                'credit_card': 'Use sandbox card: 4811 1111 1111 1114 (Exp: 12/34, CVV: 123, OTP: 112233)',
                'gopay': 'Will auto success in 1-2 minutes',
                'shopeepay': 'Will auto success in 1-2 minutes',
                'bank_transfer': 'Use VA: 3901234567890 for auto success, or simulate in dashboard'
            };
            return instructions[paymentType] || 'Check Sandbox Dashboard to simulate payment';
        }

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);

        // Initial message
        window.onload = function () {
            const result = document.getElementById('result');
            result.innerHTML = `
                <div style="background:#e7f3ff; padding:15px; border-radius:5px;">
                    <strong>🚀 Ready to Test!</strong><br>
                    Choose a payment method above to start testing Snap integration.
                </div>
            `;
        };
    </script>
</body>

</html>
