<!DOCTYPE html>
<html>

<head>
    <title>Midtrans Test - No CORS Issue</title>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js"
        data-client-key="Mid-client-oAs8x_AcQLaRYsXD"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        .result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <h1>🧪 Midtrans Test - No CORS</h1>

    <div class="max-w-xs rounded-2xl overflow-hidden shadow-lg bg-white">
        <div class="flex justify-center m-5">
            <img class="w-40"
                src="https://www.az-delivery.de/cdn/shop/products/esp32-nodemcu-module-wlan-wifi-development-board-mit-cp2102-nachfolgermodell-zum-esp8266-kompatibel-mit-arduino-872375.jpg?v=1679400491"
                alt="Product Image" class="w-full h-48 object-cover" />
        </div>
        <div class="bg-sky-100">
            <div class="text-center">
                <h1 class="text-2xl pt-6 font-semibold mb-2">ESP 32</h1>
                <span class="text-sm">Hardware IoT</span>
            </div>
            <div class="py-4 flex justify-center">
                <button class="bg-blue-600 text-white py-2 px-4 rounded-full hover:bg-blue-700 transition"
                    onclick="createPayment(75000)">
                    Beli Sekarang Rp 75.000,-
                </button>
            </div>
        </div>
    </div>

    <div id="result"></div>
    <div id="debug" style="margin-top: 20px; padding: 15px; background: #f0f0f0;"></div>

    <script>
        // GANTI dengan credentials Anda
        const SERVER_KEY = 'Mid-server-vPNbaSeO5J4kmzQ5iEu91J3M';
        const CLIENT_KEY = 'Mid-client-oAs8x_AcQLaRYsXD';

        async function createPayment(amount) {
            const debug = document.getElementById('debug');
            const result = document.getElementById('result');

            debug.innerHTML = '🔄 Creating transaction...';
            result.innerHTML = '';

            try {
                const orderId = 'TEST_' + Date.now();

                debug.innerHTML = `Order ID: ${orderId}<br>Amount: ${amount}`;

                // Use Cors helper
                const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
                const targetUrl = 'https://app.sandbox.midtrans.com/snap/v1/transactions';

                const response = await fetch(proxyUrl + targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa(SERVER_KEY + ':')
                    },
                    body: JSON.stringify({
                        transaction_details: {
                            order_id: orderId,
                            gross_amount: amount
                        },
                        enabled_payments: ["credit_card", "permata_va",
                            "bca_va", "bni_va", "bri_va",
                            "other_qris"],
                        credit_card: {
                            secure: true
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();

                debug.innerHTML += `<br>✅ Token received!`;

                // Tampilkan Snap Popup
                window.snap.pay(data.token, {
                    onSuccess: function (result) {
                        document.getElementById('result').innerHTML =
                            '<div class="success">✅ PAYMENT SUCCESS!<br>Order ID: ' + result.order_id + '</div>';
                    },
                    onPending: function (result) {
                        document.getElementById('result').innerHTML =
                            '<div class="success">⏳ PAYMENT PENDING<br>Order ID: ' + result.order_id + '</div>';
                    },
                    onError: function (result) {
                        document.getElementById('result').innerHTML =
                            '<div class="error">❌ PAYMENT FAILED<br>Order ID: ' + result.order_id + '</div>';
                    }
                });

            } catch (error) {
                debug.innerHTML = '❌ Error: ' + error.message;
                result.innerHTML = '<div class="error">Failed: ' + error.message + '</div>';
                console.error('Payment Error:', error);
            }
        }

        // Test koneksi sederhana
        window.onload = function () {
            document.getElementById('debug').innerHTML =
                '✅ Page loaded!<br>Client Key: ' + (CLIENT_KEY ? 'Set' : 'NOT SET') +
                '<br>Server Key: ' + (SERVER_KEY ? 'Set' : 'NOT SET');
        };
    </script>
</body>

</html>
